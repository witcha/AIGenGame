<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Dash — HTML5 Platformer</title>
<style>
  :root {
    --sky-top: #2b1055;
    --sky-bot: #7597de;
    --ink: #1a1333;
    --gold: #ffd23f;
    --accent: #ff6b9d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--ink);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(18px, 4vw, 28px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--accent);
  }
  #wrap {
    position: relative;
    border: 4px solid var(--gold);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6), inset 0 0 0 2px var(--ink);
    line-height: 0;
  }
  canvas { display: block; border-radius: 4px; image-rendering: pixelated; }
  #hud {
    position: absolute; top: 10px; left: 12px;
    font-size: 16px; font-weight: bold;
    text-shadow: 2px 2px 0 rgba(0,0,0,.5);
    pointer-events: none;
  }
  #msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    background: rgba(20,12,40,.78);
    color: #fff; text-align: center;
    font-size: clamp(20px, 5vw, 36px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s; border-radius: 4px;
  }
  #msg.show { opacity: 1; }
  #msg small { font-size: 16px; color: var(--gold); font-weight: normal; }
  .hint { font-size: 13px; color: #b9a8e0; }
</style>
</head>
<body>
  <h1>Coin Dash</h1>
  <div id="wrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="hud">Coins: <span id="coins">0</span> / <span id="total">0</span></div>
    <div id="msg"></div>
  </div>
  <p class="hint">← → or A/D to move &nbsp;·&nbsp; ↑ / W / Space to jump &nbsp;·&nbsp; R to restart</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- Level data: platforms, coins, goal, spawn ----
const level = {
  spawn: { x: 40, y: 360 },
  platforms: [
    { x: 0,   y: 410, w: 800, h: 40 },   // ground
    { x: 180, y: 340, w: 110, h: 18 },
    { x: 340, y: 280, w: 110, h: 18 },
    { x: 520, y: 230, w: 120, h: 18 },
    { x: 250, y: 180, w: 90,  h: 18 },
    { x: 660, y: 330, w: 110, h: 18 },
  ],
  coins: [
    { x: 220, y: 305 }, { x: 385, y: 245 }, { x: 565, y: 195 },
    { x: 285, y: 145 }, { x: 705, y: 295 }, { x: 120, y: 375 },
  ],
  goal: { x: 720, y: 270, w: 26, h: 60 },
};

// ---- Player ----
const player = {
  x: 0, y: 0, w: 26, h: 34,
  vx: 0, vy: 0, onGround: false, face: 1,
};

const GRAV = 0.7, MOVE = 0.9, FRICTION = 0.82, MAXVX = 5.2, JUMP = 13;
const keys = {};
let coinsGot = 0, state = 'play', t = 0;
const coins = level.coins.map(c => ({ ...c, got: false }));

document.getElementById('total').textContent = coins.length;

addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ','arrowup','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key.toLowerCase() === 'r') reset();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function reset() {
  player.x = level.spawn.x; player.y = level.spawn.y;
  player.vx = player.vy = 0;
  coins.forEach(c => c.got = false);
  coinsGot = 0; state = 'play';
  document.getElementById('coins').textContent = 0;
  showMsg('');
}

function showMsg(html) {
  const m = document.getElementById('msg');
  if (!html) { m.classList.remove('show'); return; }
  m.innerHTML = html; m.classList.add('show');
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  t++;
  if (state !== 'play') return;

  // input
  if (keys['arrowleft'] || keys['a'])  { player.vx -= MOVE; player.face = -1; }
  if (keys['arrowright']|| keys['d'])  { player.vx += MOVE; player.face = 1; }
  if ((keys['arrowup'] || keys['w'] || keys[' ']) && player.onGround) {
    player.vy = -JUMP; player.onGround = false;
  }

  player.vx *= FRICTION;
  player.vx = Math.max(-MAXVX, Math.min(MAXVX, player.vx));
  player.vy += GRAV;

  // horizontal move + collide
  player.x += player.vx;
  for (const p of level.platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // vertical move + collide
  player.y += player.vy;
  player.onGround = false;
  for (const p of level.platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) { player.y = p.y - player.h; player.onGround = true; }
      else if (player.vy < 0) player.y = p.y + p.h;
      player.vy = 0;
    }
  }

  // bounds
  player.x = Math.max(0, Math.min(W - player.w, player.x));
  if (player.y > H + 100) reset();   // fell off

  // coins
  for (const c of coins) {
    if (!c.got && rectsOverlap(player, { x: c.x-10, y: c.y-10, w: 20, h: 20 })) {
      c.got = true; coinsGot++;
      document.getElementById('coins').textContent = coinsGot;
    }
  }

  // goal
  if (rectsOverlap(player, level.goal)) {
    if (coinsGot === coins.length) {
      state = 'win';
      showMsg('You Win! 🎉<small>Press R to play again</small>');
    } else {
      showMsg(`Collect all coins first!<small>${coinsGot}/${coins.length}</small>`);
      setTimeout(() => { if (state==='play') showMsg(''); }, 900);
    }
  }
}

function draw() {
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b1055'); g.addColorStop(1, '#7597de');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // parallax hills
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(120 + i*180, 420, 110, Math.PI, 0); ctx.fill();
  }

  // platforms
  for (const p of level.platforms) {
    ctx.fillStyle = '#3a2d5c';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#5a8f3c';   // grassy top
    ctx.fillRect(p.x, p.y, p.w, 6);
  }

  // goal flag
  const gl = level.goal;
  ctx.fillStyle = '#caa83f';
  ctx.fillRect(gl.x + gl.w/2 - 2, gl.y, 4, gl.h);
  ctx.fillStyle = '#ff6b9d';
  const flag = Math.sin(t*0.15)*3;
  ctx.beginPath();
  ctx.moveTo(gl.x + gl.w/2 + 2, gl.y);
  ctx.lineTo(gl.x + gl.w/2 + 22, gl.y + 8 + flag);
  ctx.lineTo(gl.x + gl.w/2 + 2, gl.y + 16);
  ctx.fill();

  // coins
  for (const c of coins) {
    if (c.got) continue;
    const bob = Math.sin((t + c.x)*0.08) * 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y + bob, 9, 0, Math.PI*2);
    ctx.fillStyle = '#ffd23f'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#caa83f'; ctx.stroke();
    ctx.fillStyle = '#caa83f';
    ctx.fillRect(c.x - 2, c.y + bob - 5, 4, 10);
  }

  // player
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  ctx.scale(player.face, 1);
  ctx.fillStyle = '#ff6b9d';
  ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
  ctx.fillStyle = '#fff';   // eye
  ctx.fillRect(2, -player.h/2 + 7, 6, 6);
  ctx.fillStyle = '#1a1333';
  ctx.fillRect(4, -player.h/2 + 9, 3, 3);
  ctx.restore();
}

function loop() {
  update(); draw();
  requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
